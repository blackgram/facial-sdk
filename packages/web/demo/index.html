<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liveness SDK Web Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F6F8;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .app { width: 100%; max-width: 420px; height: 100dvh; position: relative; }

    /* Home screen */
    .home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      height: 100%;
      gap: 16px;
    }
    .home h1 { font-size: 24px; color: #111; font-weight: 700; }
    .home p { font-size: 15px; color: #6B7280; text-align: center; line-height: 1.5; }
    .start-btn {
      margin-top: 24px;
      padding: 16px 32px;
      background: #F97316;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    .start-btn:hover { opacity: 0.9; }

    /* Result */
    .result-card {
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      margin-top: 24px;
      display: none;
    }
    .result-card.show { display: block; }
    .result-card h3 { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 8px; }
    .result-card p { font-size: 14px; color: #6B7280; margin-bottom: 4px; }
    .result-frames {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 12px;
      padding-bottom: 8px;
    }
    .result-frames .frame {
      flex-shrink: 0;
      text-align: center;
    }
    .result-frames img {
      width: 72px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      background: #E5E7EB;
    }
    .result-frames .label {
      font-size: 11px;
      color: #6B7280;
      margin-top: 4px;
    }
    .json-output {
      margin-top: 12px;
      background: #F3F4F6;
      border-radius: 8px;
      padding: 8px;
      max-height: 180px;
      overflow: auto;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #374151;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Liveness component */
    diguiux-liveness {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }
    diguiux-liveness.active { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <div class="home" id="home">
      <h1>Liveness SDK Web Demo</h1>
      <p>This demonstrates the <code>@diguiux/liveness-web</code> package using MediaPipe face detection in the browser.</p>

      <div class="result-card" id="result-card">
        <h3>Last Result</h3>
        <p id="result-summary"></p>
        <div class="result-frames" id="result-frames"></div>
        <div class="json-output" id="result-json"></div>
      </div>

      <button class="start-btn" id="start-btn">Start Liveness Capture</button>
    </div>

    <diguiux-liveness id="liveness" theme-primary="#F97316"></diguiux-liveness>
  </div>

  <script type="module">
    import '/dist/liveness-web.esm.js';

    const prompts = [
      { id: 'center_face', instruction: 'Center your face in the circle', timeout: 10000 },
      { id: 'look_straight', instruction: 'Look straight at the camera', timeout: 8000 },
      { id: 'turn_left', instruction: 'Turn your head to the left', timeout: 6000 },
      { id: 'smile', instruction: 'Give us a smile 😊', timeout: 5000 },
    ];

    let livenessEl = document.getElementById('liveness');
    const homeEl = document.getElementById('home');
    const startBtn = document.getElementById('start-btn');
    const resultCard = document.getElementById('result-card');
    const resultSummary = document.getElementById('result-summary');
    const resultFrames = document.getElementById('result-frames');
    const resultJson = document.getElementById('result-json');

    function setupLiveness() {
      livenessEl.prompts = prompts;
      livenessEl.enableLogs = true;
    }

    function resetLiveness() {
      // Remove and re-create the element for a clean slate
      const parent = livenessEl.parentElement;
      livenessEl.remove();
      const newEl = document.createElement('diguiux-liveness');
      newEl.id = 'liveness';
      newEl.setAttribute('theme-primary', '#F97316');
      parent.appendChild(newEl);
      livenessEl = newEl;
      setupLiveness();
      attachEvents();
    }

    function attachEvents() {
      livenessEl.addEventListener('complete', (e) => {
        const result = e.detail;
        console.log('[LivenessWeb Result]', result);

        livenessEl.classList.remove('active');
        homeEl.style.display = 'flex';

        resultCard.classList.add('show');
        resultSummary.textContent = `${result.frames.length} frames captured in ${result.durationMs}ms — SDK v${result.metadata.sdkVersion}`;
        resultFrames.innerHTML = result.frames.map((frame) => `
          <div class="frame">
            <img src="${frame.uri}" alt="${frame.prompt.id}" />
            <div class="label">${frame.prompt.id}</div>
          </div>
        `).join('');
        resultJson.textContent = JSON.stringify(result, null, 2);

        resetLiveness();
      });

      livenessEl.addEventListener('cancel', () => {
        livenessEl.classList.remove('active');
        homeEl.style.display = 'flex';
        resetLiveness();
      });

      livenessEl.addEventListener('error', (e) => {
        console.error('[LivenessWeb Error]', e.detail);
        livenessEl.classList.remove('active');
        homeEl.style.display = 'flex';
        alert('Error: ' + e.detail.message);
        resetLiveness();
      });

      livenessEl.addEventListener('promptstart', (e) => {
        console.log('[Prompt Start]', e.detail.index, e.detail.prompt.id);
      });

      livenessEl.addEventListener('progress', (e) => {
        console.log('[Progress]', `${e.detail.completed}/${e.detail.total}`);
      });
    }

    setupLiveness();
    attachEvents();

    startBtn.addEventListener('click', () => {
      homeEl.style.display = 'none';
      livenessEl.classList.add('active');
    });
  </script>
</body>
</html>
